<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#72E2AE">
    <title>Kumar Gaurav | Software Developer & Data Scientist Portfolio</title>
    <meta name="description"
        content="Portfolio of Kumar Gaurav - Software Developer, Data Science Student, and EEE undergraduate at IIIT Bhubaneswar.">
    <meta name="keywords"
        content="Kumar Gaurav, Software Developer, Data Science, EEE, IIIT Bhubaneswar, IIT Madras, SkillFleet">
    <meta name="author" content="Kumar Gaurav">

    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="./index.css?v=1.0.2">

    <!-- Google Font Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Canvas background for dynamic particle effect -->
    <canvas id="particle-canvas"></canvas>

    <!-- Hidden SVG for global gradients -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none;">
        <defs>
            <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#72e2ae" />
                <stop offset="100%" stop-color="#34afcb" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Loading Screen -->
    <div id="loader_block">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <main>

        <!-- SIDEBAR -->
        <aside class="sidebar" data-sidebar>
            <div class="sidebar-info">
                <figure class="avatar-box">
                    <img id="profile-avatar" src="" alt="Kumar Gaurav" width="80">
                </figure>
                <div class="info-content">
                    <h1 class="name" id="profile-name">Kumar Gaurav</h1>
                    <p class="title" id="profile-title">Software Developer</p>
                </div>
                <button class="info_more-btn" data-sidebar-btn>
                    <span>Show Contacts</span>
                    <ion-icon name="chevron-down"></ion-icon>
                </button>
            </div>

            <div class="sidebar-info_more">
                <div class="separator"></div>
                <ul class="contacts-list" id="contacts-list">
                    <!-- JavaScript will dynamically populate email, phone, location -->
                </ul>
                <div class="separator"></div>
                <ul class="social-list" id="social-list">
                    <!-- JavaScript will dynamically populate social links -->
                </ul>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="main-content">

            <!-- NAVBAR -->
            <nav class="navbar">
                <ul class="navbar-list">
                    <li class="navbar-item">
                        <button class="navbar-link active" data-nav-link="about">About</button>
                    </li>
                    <li class="navbar-item">
                        <button id="resume-btn" class="navbar-link">Resume</button>
                    </li>
                    <li class="navbar-item">
                        <button class="navbar-link" data-nav-link="contact">Contact</button>
                    </li>
                </ul>
            </nav>

            <!-- ABOUT TAB PAGE -->
            <article class="about active" data-page="about">
                <header>
                    <h2 class="h2 article-title">About me</h2>
                </header>

                <section class="about-text" id="bio-container">
                    <!-- Dynamic biography paragraphs -->
                </section>

                <!-- PROJECTS SUBSECTION -->
                <section class="service">
                    <h3 class="h3 service-title">My Projects</h3>
                    <ul class="service-list" id="projects-list">
                        <!-- Dynamic project cards -->
                    </ul>
                </section>

                <!-- ORGANIZATIONS SUBSECTION -->
                <section class="clients">
                    <h3 class="h3 clients-title">Organisations I've been part of</h3>
                    <ul class="clients-list has-scrollbar" id="orgs-list">
                        <!-- Dynamic company/school logos -->
                    </ul>
                </section>
            </article>

            <!-- CONTACT TAB PAGE -->
            <article class="contact" data-page="contact">
                <header>
                    <h2 class="h2 article-title">Contact</h2>
                </header>

                <section class="contact-form">
                    <h3 class="h3 form-title">Contact Form</h3>
                    <form id="contact-form" class="form" data-form>
                        <div class="input-wrapper">
                            <input type="text" name="name" class="form-input" placeholder="Full name"
                                aria-label="Full name" required data-form-input>
                            <input type="email" name="email" class="form-input" placeholder="Email address"
                                aria-label="Email address" required data-form-input>
                        </div>
                        <textarea name="message" class="form-input" placeholder="Your Message" aria-label="Your Message"
                            required data-form-input></textarea>
                        <button class="form-btn" type="submit" disabled data-form-btn id="message-btn">
                            <ion-icon name="paper-plane" id="message-icon"></ion-icon>
                            <span id="message-text">Send Message</span>
                        </button>
                    </form>
                </section>
            </article>

        </div>

    </main>

    <!-- RESUME MODAL PREVIEW OVERLAY -->
    <div id="resume-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
        <div class="resume-modal-container">
            <div class="modal-header">
                <div>
                    <h3 id="modal-title" class="modal-title">Resume Preview</h3>
                    <p class="modal-subtitle">Kumar Gaurav — AI/ML Engineer</p>
                </div>
                <div class="modal-actions">
                    <a href="./KumarGauravResume.pdf" target="_blank" rel="noopener noreferrer"
                        class="modal-action-btn border-btn" aria-label="Open Resume in new tab">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                            <polyline points="15 3 21 3 21 9" />
                            <line x1="10" y1="14" x2="21" y2="3" />
                        </svg>
                        <span>Open Tab</span>
                    </a>
                    <a href="./KumarGauravResume.pdf" download="Kumar_Gaurav_Resume.pdf"
                        class="modal-action-btn fill-btn" aria-label="Download Resume PDF">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        <span>Download</span>
                    </a>
                    <button id="close-modal-btn" class="close-modal-btn" aria-label="Close resume preview">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <iframe src="./KumarGauravResume.pdf#toolbar=0" class="pdf-iframe"
                    title="Kumar Gaurav Resume PDF"></iframe>
            </div>
        </div>
    </div>

    <!-- Data & Custom Scripts -->
    <script src="./data.js"></script>
    <script src="./particles.js"></script>
    <script src="./index.js?v=1.0.2"></script>

    <!-- Ionicon Link -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
